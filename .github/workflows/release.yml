name: release

# 推 v* 标签时，只在 Windows 上构建并发布 Release。
# 产物：NSIS 安装程序 DeskBasket-Setup-*.exe（装当前用户目录，覆盖升级不动筐数据）。
# 桌面层、系统图标、注册表自启、原生状态助手都依赖 Windows API，故不再出 mac/Linux 包。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      # helper 只打进 Windows 包（见 package.json：win.extraResources）。
      # predist/prepack 只在 npm run dist / npm pack 时触发，这里直接调 electron-builder，
      # 所以显式编译一次，保证 C# 源码改动后发布包带的是新编译的 helper。
      - name: 编译 Windows 原生 helper
        run: npm run build:native
      - name: 校验 helper 产物存在且非空
        shell: pwsh
        run: |
          $exe = 'native/DeskBasketState.exe'
          $item = Get-Item -LiteralPath $exe -ErrorAction Stop
          if ($item.Length -le 0) { throw "helper 为空：$exe" }
          Write-Host "helper OK：$exe ($($item.Length) bytes)"
      # 推 tag 时 --publish always 会创建/补充同名的 draft release
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
