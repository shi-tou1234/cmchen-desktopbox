name: release

# 推 v* 标签时，在三个系统上构建并发布 Release。
# 产物：Windows（NSIS 安装程序 DeskBasket-Setup-*.exe）、macOS（dmg + zip）、Linux（AppImage + deb）。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      # helper 只打进 Windows 包（见 package.json：win.extraResources，顶层已不再无条件复制）。
      # predist/prepack 只在 npm run dist / npm pack 时触发，这里直接调 electron-builder，
      # 所以 Windows 上要显式编译一次，保证 C# 源码改动后发布包带的是新编译的 helper。
      - name: 编译 Windows 原生 helper
        if: runner.os == 'Windows'
        run: npm run build:native
      - name: 校验 helper 产物存在且非空
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = 'native/DeskBasketState.exe'
          $item = Get-Item -LiteralPath $exe -ErrorAction Stop
          if ($item.Length -le 0) { throw "helper 为空：$exe" }
          Write-Host "helper OK：$exe ($($item.Length) bytes)"
      # electron-builder 在哪个系统上跑就打哪个系统的包；
      # 推 tag 时 --publish always 会自动创建/补充同名的 draft release
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
