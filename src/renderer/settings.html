<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>DeskBasket 设置</title>
<link rel="stylesheet" href="common.css">
<style>
  .panel { border-radius: 14px; }
  input[type="text"] {
    background: var(--field-bg);
    color: var(--field-fg);
    border: 0;
    border-radius: 7px;
    padding: 4px 8px;
    font-size: 12px;
    width: 180px;
  }
  /* 快捷方式候选清单：一行一项，左边勾选框 + 图标 + 名字 */
  .shortcut-list {
    border-radius: 9px;
    background: var(--list-bg);
    max-height: 220px;
    overflow-y: auto;
    padding: 4px;
  }
  .shortcut-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 6px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  .shortcut-row:hover { background: var(--hover-bg); }
  .shortcut-row img { width: 18px; height: 18px; object-fit: contain; }
  .shortcut-row .name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .shortcut-row .state { font-size: 11px; color: var(--text-faint); flex: 0 0 auto; }
  .shortcut-row .btn { padding: 2px 8px; font-size: 11px; flex: 0 0 auto; }
</style>
</head>
<body>
  <div class="panel">
    <div class="panel-head drag-region">
      <span class="panel-title">DeskBasket 设置</span>
      <span class="panel-count"></span>
      <button class="head-btn danger no-drag" id="btn-close">✕</button>
    </div>

    <div class="settings no-drag">
      <div class="group">
        <h3>外观</h3>
        <div class="row">
          <label for="accent">磨砂模式</label>
          <select id="accent"></select>
        </div>
        <div class="row">
          <label for="themeMode">配色主题</label>
          <select id="themeMode"></select>
        </div>
        <div class="row">
          <label for="reduceMotion">减弱动画（关掉入场/翻页/弹跳等装饰动画，保留悬停放大）</label>
          <input type="checkbox" id="reduceMotion">
        </div>
        <div class="row">
          <label for="iconSize">文件夹弹窗内图标大小</label>
          <input type="number" id="iconSize" min="24" max="128" step="8">
        </div>
      </div>

      <div class="group">
        <h3>底部 Dock</h3>
        <div class="row">
          <label for="dockEnabled">显示 Dock（固定于桌面底部）</label>
          <input type="checkbox" id="dockEnabled">
        </div>
        <div class="row">
          <label for="dockAlways">常驻显示（关掉后鼠标离开自动收起，不挡其他窗口）</label>
          <input type="checkbox" id="dockAlways">
        </div>
        <div class="row">
          <label for="dockDisplay">Dock 放在哪块屏</label>
          <select id="dockDisplay"></select>
        </div>
        <div class="row">
          <label for="dockIconSize">Dock 图标大小</label>
          <input type="number" id="dockIconSize" min="24" max="128" step="8">
        </div>
        <div class="row">
          <label for="dockMagnify">鼠标靠近的放大程度（%）</label>
          <input type="number" id="dockMagnify" min="0" max="100" step="10">
        </div>
        <div class="row">
          <label for="dockBottomGap">离屏幕底边的距离（px）</label>          <input type="number" id="dockBottomGap" min="0" max="200" step="4">
        </div>
        <div class="row">
          <span class="hint" id="dockCount"></span>
        </div>
      </div>

      <div class="group">
        <h3>Dock 上的快捷方式</h3>
        <div class="shortcut-list" id="shortcutList"></div>
        <div class="row" style="margin-top:6px;justify-content:flex-start;gap:8px;flex-wrap:wrap">
          <button class="btn" id="btnPick">选择文件添加…</button>
          <span class="hint">勾选即加入 Dock，取消勾选即移除；也可以直接把文件拖到 Dock 上。图标取的是不带 Windows 小箭头的原图。</span>
        </div>
      </div>

      <div class="group">
        <h3>Dock 上的文件夹</h3>
        <div class="basket-list" id="basketList"></div>
        <div class="row" style="margin-top:6px">
          <label for="basketName">选中文件夹的名字</label>
          <input type="text" id="basketName" maxlength="24">
        </div>
        <div class="row" style="justify-content:flex-start;gap:6px;flex-wrap:wrap">
          <button class="btn" id="btnVisible">在 Dock 上显示 / 隐藏</button>
          <button class="btn" id="btnAddFiles">添加文件…</button>
          <button class="btn" id="btnAddDirs">添加文件夹…</button>
          <button class="btn" id="btnPrune">清理失效项</button>
          <button class="btn" id="btnNew">新建文件夹</button>
          <button class="btn" id="btnDelete">删除</button>
        </div>
        <div class="row" style="margin-top:8px;display:block">
          <span class="hint" id="basketCandidateHint">桌面上的条目：勾选即加进这个筐（一次能勾一堆；磁盘文件不动）。不在桌面上的文件用上面的「添加文件…」（对话框里按住 Ctrl / Shift 可多选）。</span>
        </div>
        <div class="shortcut-list" id="basketCandidateList"></div>
      </div>

      <div class="group">
        <h3>系统</h3>
        <div class="row">
          <label for="autostart">开机自启动</label>
          <input type="checkbox" id="autostart">
        </div>
        <div class="row">
          <span class="hint" id="autostartInfo"></span>
        </div>
      </div>

      <div class="footer">
        <button class="btn" id="btnReset">恢复默认</button>
        <span class="status-text" id="hint"></span>
      </div>
    </div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
