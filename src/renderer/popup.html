<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>DeskBasket 文件夹</title>
<link rel="stylesheet" href="common.css">
<script src="menu.js"></script>
<style>
  html, body { width: 100%; height: 100%; }

  /* ---------------------------------------------------------------- 完全透明
     窗口本身透明，页面也不铺任何底色：文件夹内容直接浮在桌面之上，
     只留一圈细边框把面板的轮廓勾出来，文字靠 common.css 的阴影保证可读。
     **不再画 box-shadow 投影**：弹窗窗口带 8px 隐形 resize border（客户区比窗口矩形小一圈），
     投影会画进那条透明边带、被窗口边界裁成一道暗框——和 1px 边框叠在一起就是领导说的
     "多个边框"。外扩的软投影改由窗口原生投影负责（见 windows.js createPopupWindow 的
     hasShadow），它画在窗口矩形之外，不会和边框抢轮廓。 */
  .popup-edge {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    border: 1px solid var(--border);
    pointer-events: none;
  }

  /* 有文件拖到弹窗上：给一圈高亮，表示"松手会加进这个筐" */
  body.dragover .popup-edge { border-color: rgba(140, 190, 255, 0.9); }

  /* 弹窗内拖动换位（3.9.0）：插入位置画一条竖提示线（左缘=插到这格前面，右缘=追加到末尾），
     被拖的那格本体变淡。提示线用 inset box-shadow，不占布局、盖在格子底色之上。 */
  .cell.drop-before { box-shadow: inset 3px 0 0 0 var(--accent); }
  .cell.drop-after { box-shadow: inset -3px 0 0 0 var(--accent); }
  .cell.dragging-source { opacity: 0.4; }

  /* 打开/收起动画：整块内容从图标位置"抽"出来再缩回去（macOS 的文件夹堆栈那种感觉）。
     变换原点落在 Dock 图标中心（--origin-x 由主进程按锚点算好），底边贴齐。
     完全透明模式：窗口本身是透的、没有"底盘"，内容可以放心从很小放大。
     磨砂模式（body.glass）：窗口底是一整块系统材质，内容缩到 0.28 会和材质底对不上、
     看着像闪一下，所以那一档改成"轻微下沉 + 淡"。
     **窗口本身不做透明度动画**：给挂材质的窗口 setOpacity 会让材质底闪一下，
     开和关都看得见。 */
  .popup-frame {
    position: absolute;
    inset: 0;
    transform-origin: var(--origin-x, 50%) 100%;
    /* 交给合成器单独一层：缩放/淡入就只是图层变换，不会每帧重画整块内容 */
    will-change: transform, opacity;
    transition:
      transform 260ms cubic-bezier(0.34, 1.28, 0.5, 1),
      opacity 180ms ease-out;
  }
  body.collapsed .popup-frame {
    transform: translateY(16px) scale(0.28);
    opacity: 0;
    /* 收起：干脆收回去，不拖泥带水 */
    transition:
      transform 200ms cubic-bezier(0.4, 0, 0.9, 0.4),
      opacity 150ms ease-in;
  }
  body.glass .popup-frame {
    transition:
      transform 190ms cubic-bezier(0.34, 1.2, 0.5, 1),
      opacity 170ms ease-out;
  }
  body.glass.collapsed .popup-frame {
    transform: translateY(10px) scale(0.94);
    opacity: 0;
    transition:
      transform 160ms ease-in,
      opacity 150ms ease-in;
  }
  /* 减弱动画（#7）：开合不缩放不淡，直接出现/消失 */
  body.reduce-motion .popup-frame {
    transition: none;
  }
  body.reduce-motion.collapsed .popup-frame {
    transform: none;
  }
  /* 系统「减少动效」：与上面的 body.reduce-motion 并列生效，任一命中开合都直接出现/消失。
     选择器与 body.reduce-motion 一一对齐（含 .glass 变体），放到所有开合规则之后才压得住。 */
  @media (prefers-reduced-motion: reduce) {
    .popup-frame,
    body.glass .popup-frame {
      transition: none;
    }
    body.collapsed .popup-frame,
    body.glass.collapsed .popup-frame {
      transform: none;
    }
  }

  .popup {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .popup-head {
    height: 38px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 8px 0 12px;
    flex: 0 0 auto;
  }
  .popup-title {
    font-size: 13px;
    font-weight: 600;
    flex: 1 1 auto;
    min-width: 0;                    /* 收缩下限放开到 0：窄窗口靠省略号截断，不许把右侧按钮挤出边界 */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-btn {
    width: 26px;
    height: 26px;
    border: 0;
    border-radius: 8px;
    background: var(--head-btn-bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    flex: 0 0 auto;
  }
  .nav-btn:hover:not(:disabled) { background: var(--head-btn-hover); }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }
  .nav-btn.wide { width: auto; padding: 0 10px; font-size: 12px; }
  /* ⌂ 按钮文案是整串筐名：窄窗口（最小 260px）下必须和标题一起可收缩，否则整串名字会把
     「＋/✕」挤出 .popup 的 overflow:hidden 之外、点都点不到。按 id 单独收紧是因为
     「＋」也挂 .nav-btn.wide，它必须保持 flex:0 0 auto 永不缩。 */
  #btnHome {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .popup-grid {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 4px 8px 10px;
    display: grid;
    grid-template-columns: repeat(auto-fill, 88px);
    grid-auto-rows: min-content;
    justify-content: start;
    align-content: start;
  }
  /* 滚动条样式不再内联一份：统一走 common.css 里 .popup-grid 那条共用规则（细滚动条） */

  .popup-status {
    padding: 0 12px 8px;
    font-size: 12px;
    color: var(--text-dim);
    flex: 0 0 auto;
  }
  .popup-status.error { color: #ffbe78; }
  /* 浅色主题：#ffbe78 压近白底只有约 1.6:1、错误提示读不出来，换成深棕红
     （保留「警告/错误」语义，对 #fff 实测约 7.6:1 ≥ 4.5:1）；暗色仍用原值 */
  @media (prefers-color-scheme: light) {
    .popup-status.error { color: #9b2c1b; }
  }

  .empty-tip {
    position: absolute;
    inset: 38px 0 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-faint);
    font-size: 12px;
    pointer-events: none;
  }

  /* 右下角的拖拽调尺寸把手（#3）：平时只是三个小点，鼠标靠近才亮 */
  .resize-grip {
    position: absolute;
    right: 3px;
    bottom: 3px;
    width: 18px;
    height: 18px;
    cursor: nwse-resize;
    opacity: 0.35;
    touch-action: none;
  }
  .resize-grip:hover { opacity: 0.9; }
  .resize-grip::before {
    content: '';
    position: absolute;
    right: 2px;
    bottom: 2px;
    width: 10px;
    height: 10px;
    background:
      radial-gradient(circle, var(--text-dim) 1.2px, transparent 1.6px) 0 0 / 5px 5px;
  }
</style>
</head>
<body class="collapsed">
  <div class="popup-frame">
    <div class="popup">
      <div class="popup-head">
        <button class="nav-btn wide" id="btnHome" title="回到文件夹">⌂</button>
        <button class="nav-btn" id="btnUp" title="上一级">↑</button>
        <span class="popup-title" id="title"></span>
        <button class="nav-btn wide" id="btnAdd" title="往这个筐里添加文件（可多选；也可以直接把文件拖进窗口，或拖到 Dock 的文件夹图标上）">＋</button>
        <button class="nav-btn" id="btnClose" title="关闭">✕</button>
      </div>
      <div class="popup-grid" id="grid" role="listbox" aria-multiselectable="true" aria-label="文件列表"></div>
      <div class="popup-status" id="status"></div>
      <div class="empty-tip" id="emptyTip" style="display:none"></div>
    </div>
    <div class="popup-edge"></div>
    <div class="resize-grip" id="grip" title="拖动调整窗口大小"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
