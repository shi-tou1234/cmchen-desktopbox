<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>DeskBasket 文件夹</title>
<link rel="stylesheet" href="common.css">
<script src="menu.js"></script>
<style>
  html, body { width: 100%; height: 100%; }

  /* ---------------------------------------------------------------- 完全透明
     窗口本身透明，页面也不铺任何底色：文件夹内容直接浮在桌面之上，
     只留一圈细边框和一层投影把面板的轮廓勾出来，文字靠 common.css 的阴影保证可读。 */
  .popup-edge {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.14),
      0 18px 44px rgba(0, 0, 0, 0.38);
    pointer-events: none;
  }

  /* 有文件拖到弹窗上：给一圈高亮，表示"松手会加进这个筐" */
  body.dragover .popup-edge { border-color: rgba(140, 190, 255, 0.9); }

  /* 打开/收起动画：整块内容从图标位置"抽"出来再缩回去（macOS 的文件夹堆栈那种感觉）。
     变换原点落在 Dock 图标中心（--origin-x 由主进程按锚点算好），底边贴齐。 */
  .popup-frame {
    position: absolute;
    inset: 0;
    transform-origin: var(--origin-x, 50%) 100%;
    /* 交给合成器单独一层：缩放/淡入就只是图层变换，不会每帧重画整块内容
       （弹窗是大窗口，重画很容易掉帧，看着就是"一卡一卡"） */
    will-change: transform, opacity;
    /* 打开：末尾带一点回弹，像真的从图标里"抽"出来 */
    transition:
      transform 260ms cubic-bezier(0.34, 1.28, 0.5, 1),
      opacity 180ms ease-out;
  }
  body.collapsed .popup-frame {
    transform: translateY(16px) scale(0.28);
    opacity: 0;
    /* 收起：干脆收回去，不拖泥带水 */
    transition:
      transform 200ms cubic-bezier(0.4, 0, 0.9, 0.4),
      opacity 150ms ease-in;
  }

  .popup {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .popup-head {
    height: 38px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 8px 0 12px;
    flex: 0 0 auto;
  }
  .popup-title {
    font-size: 13px;
    font-weight: 600;
    flex: 1 1 auto;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-btn {
    width: 26px;
    height: 26px;
    border: 0;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.10);
    color: #e8e9ee;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    flex: 0 0 auto;
  }
  .nav-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.22); }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }
  .nav-btn.wide { width: auto; padding: 0 10px; font-size: 12px; }

  .popup-grid {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 4px 8px 10px;
    display: grid;
    grid-template-columns: repeat(auto-fill, 88px);
    grid-auto-rows: min-content;
    justify-content: start;
    align-content: start;
  }

  .popup-status {
    padding: 0 12px 8px;
    font-size: 12px;
    color: #c9cad2;
    flex: 0 0 auto;
  }
  .popup-status.error { color: #ffbe78; }

  .empty-tip {
    position: absolute;
    inset: 38px 0 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #a9abb5;
    font-size: 12px;
    pointer-events: none;
  }
</style>
</head>
<body class="collapsed">
  <div class="popup-frame">
    <div class="popup">
      <div class="popup-head">
        <button class="nav-btn wide" id="btnHome" title="回到文件夹">⌂</button>
        <button class="nav-btn" id="btnUp" title="上一级">↑</button>
        <span class="popup-title" id="title"></span>
        <button class="nav-btn wide" id="btnAdd" title="往这个筐里添加文件（可多选；也可以直接把文件拖进窗口，或拖到 Dock 的文件夹图标上）">＋</button>
        <button class="nav-btn" id="btnClose" title="关闭">✕</button>
      </div>
      <div class="popup-grid" id="grid"></div>
      <div class="popup-status" id="status"></div>
      <div class="empty-tip" id="emptyTip" style="display:none"></div>
    </div>
    <div class="popup-edge"></div>
  </div>

  <script>
    const api = window.deskbasket;
    const el = (id) => document.getElementById(id);

    let view = null;       // 当前视图：{ kind, name, path?, parent?, basketId?, view?, entries, error }
    let homeView = null;   // 初始视图（从筐导航出去后能回来）
    let iconSize = 48;
    let selectedPath = null;

    function isDirEntry(entry) {
      return Boolean(entry && entry.isDir);
    }

    function baseName(target) {
      return String(target).replace(/[\\/]+$/, '').split(/[\\/]/).pop() || target;
    }

    // 图标取不到时的兜底：既不留空白，也不让浏览器画「破图」标记
    function fallbackIcon() {
      const full = [
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">',
        '<path d="M12 4h16l8 8v32a2 2 0 0 1-2 2H12a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="#8d93a5"/>',
        '<path d="M28 4l8 8h-8z" fill="#c3c8d6"/>',
        '</svg>'
      ].join('');
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(full);
    }

    // ---------------------------------------------------------------- 渲染

    function makeCell(entry) {
      const cell = document.createElement('div');
      cell.className = 'cell' + (entry.exists === false ? ' missing' : '');
      cell.title = entry.path;

      const img = document.createElement('img');
      if (entry.iconUrl) {
        // 主进程已经把图标算好塞进载荷了：直接画，不用再等一次 IPC 和图片解码
        img.src = entry.iconUrl;
      } else {
        // 载荷里没有（算图标超时了）：退回异步取，先用兜底图标垫着
        img.src = fallbackIcon();
        api
          .getIcon(entry.path, iconSize)
          .then((dataUrl) => {
            if (dataUrl) img.src = dataUrl;
          })
          .catch(() => {});
      }

      const name = document.createElement('div');
      name.className = 'name';
      // 与桌面图标一致：快捷方式不带 .lnk/.url 后缀展示
      name.textContent = entry.name.replace(/\.(lnk|url)$/i, '');

      cell.append(img, name);

      cell.addEventListener('click', () => {
        for (const node of el('grid').children) node.classList.remove('selected');
        cell.classList.add('selected');
        selectedPath = entry.path;
      });

      cell.addEventListener('dblclick', async () => {
        if (isDirEntry(entry)) {
          navigate(entry.path);
        } else {
          const result = await api.openPath(entry.path);
          if (result && result.ok === false) setStatus('打不开：' + entry.name, true);
        }
      });

      cell.addEventListener('contextmenu', (event) => {
        event.preventDefault();
        const items = [
          { key: 'open', label: isDirEntry(entry) ? '打开文件夹' : '打开' },
          { key: 'reveal', label: '在系统资源管理器中显示' }
        ];
        if (view.kind === 'basket') {
          items.push({ separator: true }, { key: 'remove', label: '从这个筐移除' });
        }
        window.showContextMenu(items, event).then(async (picked) => {
          if (!picked) return;
          if (picked === 'open') {
            if (isDirEntry(entry)) navigate(entry.path);
            else api.openPath(entry.path);
          } else if (picked === 'reveal') {
            api.revealPath(entry.path);
          } else if (picked === 'remove') {
            await api.removeItem(view.basketId, entry.path);
            reloadHome();
          }
        });
      });

      return cell;
    }

    function setStatus(text, isError = false) {
      el('status').textContent = text || '';
      el('status').className = 'popup-status' + (isError ? ' error' : '');
    }

    function render() {
      const title = view.kind === 'basket' ? view.name : (view.name || baseName(view.path || ''));
      el('title').textContent = title;
      document.title = 'DeskBasket · ' + title;

      const grid = el('grid');
      grid.innerHTML = '';
      selectedPath = null;

      const entries = view.entries || [];
      for (const entry of entries) grid.append(makeCell(entry));

      const hasHome = homeView && view !== homeView;
      el('btnHome').style.display = hasHome ? '' : 'none';
      el('btnHome').textContent = hasHome ? '⌂ ' + homeView.name : '';
      el('btnUp').disabled = !(view.kind === 'dir' && view.parent);
      el('btnUp').style.display = view.kind === 'dir' ? '' : 'none';
      el('btnAdd').style.display = view.kind === 'basket' ? '' : 'none';

      if (view.error) {
        setStatus(view.error, true);
        el('emptyTip').style.display = 'none';
        return;
      }
      el('emptyTip').style.display = entries.length ? 'none' : '';
      el('emptyTip').textContent =
        view.kind === 'basket'
          ? '这个筐还是空的：点上面的「＋」添加文件，或者把文件直接拖进来 / 拖到 Dock 的文件夹图标上'
          : '这个文件夹是空的';
      setStatus(entries.length ? entries.length + ' 项' : '');
    }

    // ---------------------------------------------------------------- 导航

    async function navigate(target) {
      const next = await api.popupNavigate(target);
      if (!next) return;
      view = next;
      render();
    }

    async function reloadHome() {
      // 筐内容被移除后刷新当前视图
      if (view.kind === 'basket') {
        const fresh = await api.popupReady();
        if (fresh) {
          homeView = fresh;
          view = fresh;
        }
      }
      render();
    }

    el('btnUp').addEventListener('click', () => {
      if (view.kind === 'dir' && view.parent) navigate(view.parent);
    });
    el('btnHome').addEventListener('click', () => {
      if (homeView) {
        view = homeView;
        render();
      }
    });
    // 「＋」：往这个筐里添加文件（可多选）。文件夹可以从设置面板加，或者直接拖进来
    el('btnAdd').addEventListener('click', async () => {
      if (!view || view.kind !== 'basket') return;
      const result = await api.pickBasketFiles(view.basketId, 'files');
      if (!result) return;
      if (!result.added) {
        setStatus('没有新增（已在这个筐里的会跳过）');
        return;
      }
      await reloadHome();
      setStatus('已加入 ' + result.added + ' 项，筐里共 ' + result.total + ' 项');
    });
    el('btnClose').addEventListener('click', () => api.popupClose());
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') api.popupClose();
    });

    // 把文件直接拖进弹窗 = 加到这个筐里（拖动时给一圈高亮）
    document.addEventListener('dragover', (event) => {
      if (!view || view.kind !== 'basket') return;
      event.preventDefault();
      document.body.classList.add('dragover');
    });
    document.addEventListener('dragleave', (event) => {
      // 拖到窗口外才取消高亮（子元素之间移动也会触发 dragleave）
      if (event.relatedTarget === null) document.body.classList.remove('dragover');
    });
    document.addEventListener('drop', async (event) => {
      if (!view || view.kind !== 'basket') return;
      event.preventDefault();
      document.body.classList.remove('dragover');
      const paths = api.pathsFromFiles(event.dataTransfer.files);
      if (!paths.length) return;
      const result = await api.addPaths(view.basketId, paths);
      await reloadHome();
      if (result) setStatus('已加入 ' + result.added + ' 项，筐里共 ' + result.total + ' 项');
    });

    // 点击弹窗本身保持主进程的聚焦状态（失焦自动关的定时器会被取消）
    document.addEventListener('mousedown', () => {
      api.popupPresent();
    });

    // ---------------------------------------------------------------- 启动

    // 铺开一份内容并播"从图标抽出来"的动画。
    // 图标已经在载荷里（主进程算好的 dataURL），所以这一帧就是终态、没有待解码的图片。
    function showPayload(payload) {
      view = payload;
      homeView = payload;
      iconSize = payload.iconSize || 48;
      // 动画原点落在被点开的 Dock 图标中心
      if (Number.isFinite(payload.originX)) {
        document.documentElement.style.setProperty('--origin-x', payload.originX * 100 + '%');
      }
      document.body.classList.add('collapsed');   // 先回到"收起"态，再从那里展开
      render();
      // 数据就绪后显示窗口（showInactive：不抢用户当前应用的焦点）。
      // 主进程会等页面画出第一帧再显示，所以这里要等它回话才开始展开，
      // 否则窗口还没露面、动画已经播掉一截。
      api.popupPresent().then(() => {
        requestAnimationFrame(() => {
          requestAnimationFrame(() => document.body.classList.remove('collapsed'));
        });
      });
    }

    // 主进程要收窗口时先让我们播"收回"动画
    if (api.onPopupClosing) api.onPopupClosing(() => document.body.classList.add('collapsed'));
    // 弹窗窗口是复用的：新内容从这里送进来（不用重新加载页面，动画从第一帧就顺）
    if (api.onPopupData) api.onPopupData((payload) => {
      if (payload) showPayload(payload);
    });

    (async () => {
      const payload = await api.popupReady();
      if (!payload) {
        // 主进程不认这个窗口（已被顶掉）：直接关闭，别显示一片空白
        await api.popupClose();
        return;
      }
      showPayload(payload);
    })();
  </script>
</body>
</html>
