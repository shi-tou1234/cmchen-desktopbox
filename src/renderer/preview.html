<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; media-src 'self' file:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>DeskBasket 预览</title>
<link rel="stylesheet" href="common.css">
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  :root {
    --panel: rgba(24, 27, 37, 0.985);
    --hairline: rgba(255, 255, 255, 0.08);
    --title-fg: #f0f2f7;
    --dim-fg: #a7acb8;
    --faint-fg: #7b8090;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --panel: rgba(252, 252, 255, 0.99);
      --hairline: rgba(22, 26, 36, 0.10);
      --title-fg: #24262f;
      --dim-fg: #5b5f69;
      --faint-fg: #85888f;
    }
  }
  body {
    margin: 0; background: var(--panel); color: var(--title-fg);
    display: flex; flex-direction: column; overflow: hidden;
    animation: win-in 150ms ease-out;
    font: 13px/1.55 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    user-select: none; cursor: default;
  }
  header {
    flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid var(--hairline);
  }
  .name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { font-size: 11px; color: var(--faint-fg); flex: 0 0 auto; }
  .sp { flex: 1; }
  .hint { font-size: 11px; color: var(--faint-fg); }
  main { flex: 1 1 auto; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  main img { max-width: 100%; max-height: 100%; object-fit: contain; }
  main video { max-width: 100%; max-height: 100%; outline: none; }
  main audio { width: 80%; }
  main pre {
    align-self: stretch; flex: 1; margin: 0; padding: 14px 16px; overflow: auto;
    font: 12px/1.7 Consolas, "Courier New", monospace; color: var(--dim-fg);
    white-space: pre-wrap; word-break: break-all; user-select: text; cursor: text;
  }
  main pre::-webkit-scrollbar { width: 9px; }
  main pre::-webkit-scrollbar-thumb { background: rgba(128, 132, 144, 0.4); border-radius: 8px; }
  .none { color: var(--dim-fg); font-size: 12.5px; text-align: center; line-height: 2; }

  /* 窗口淡入（1.4.1）：弹窗/菜单都有进场动画，这两扇别再「啪」地出现 */
  @keyframes win-in {
    from { opacity: 0; transform: scale(0.975); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    body { animation: none; }
  }
</style>
</head>
<body>
  <header>
    <span class="name" id="name"></span>
    <span class="meta" id="meta"></span>
    <span class="sp"></span>
    <span class="hint">空格 / Esc 关闭</span>
  </header>
  <main id="stage"></main>
  <script src="preview.js"></script>
</body>
</html>
