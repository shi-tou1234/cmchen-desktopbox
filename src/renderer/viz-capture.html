<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>DeskBasket 律动采集</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
  body {
    display: flex; align-items: center; justify-content: center;
    font: 13px/1.5 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    user-select: none; color: #eef1f8;
  }
  /* 默认隐身（抓取窗平时 1×1 在屏幕外）；只有取音频失败需要用户点一下授权时才显这个面板 */
  .panel {
    display: none; align-items: center; gap: 12px;
    padding: 12px 16px; border-radius: 14px;
    background: rgba(24, 27, 37, 0.94); border: 1px solid rgba(255, 255, 255, 0.10);
  }
  .panel .txt { font-size: 12.5px; color: #b7bcc9; }
  .panel button {
    font: inherit; font-size: 12.5px; cursor: pointer; border: none; border-radius: 9px;
    padding: 7px 13px; color: #eef1f8; background: linear-gradient(180deg, #5a8bff, #6a54d8);
  }
  .panel button:active { transform: translateY(1px); }
  /* body[data-ask] 时（主进程把窗口显出来要用户点）才显示面板 */
  body[data-ask] .panel { display: flex; }
</style>
</head>
<body>
  <div class="panel">
    <span class="txt" id="hint">需要你点一下，允许读取系统声音</span>
    <button id="grant" type="button">开启律动</button>
  </div>
  <script src="viz-capture.js"></script>
</body>
</html>
