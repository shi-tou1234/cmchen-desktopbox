<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>DeskBasket 菜单</title>
<link rel="stylesheet" href="common.css">
<style>
  /* 窗口是透明且尺寸刚好的，菜单底色由这里画：不跟随磨砂设置——菜单要的是一眼看清 */
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }

  .menu {
    position: absolute;
    inset: 0;
    padding: 4px 0;
    border-radius: 10px;
    background: rgba(32, 33, 40, 0.96);
    border: 1px solid rgba(255, 255, 255, 0.16);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    /* 展开动画：从"点下去的那一侧"长出来（Dock 在下面，所以原点默认在下） */
    transform-origin: var(--origin-x, 12px) var(--origin-y, 100%);
    opacity: 0;
    transform: scale(0.92) translateY(4px);
    transition:
      opacity 90ms ease-out,
      transform 150ms cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  body.ready .menu { opacity: 1; transform: none; }
  /* 浅色主题里菜单换成浅色底 + 深色字，跟整套配色对齐（#1） */
  @media (prefers-color-scheme: light) {
    .menu {
      background: rgba(246, 247, 250, 0.97);
      border: 1px solid rgba(0, 0, 0, 0.14);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
    }
  }
  /* 减弱动画（#7）：不缩放不淡，直接就位。系统"减少动效"或本程序设置里关掉都算 */
  @media (prefers-reduced-motion: reduce) {
    .menu { transition: none; opacity: 1; transform: none; }
  }
  body.reduce-motion .menu { transition: none; opacity: 1; transform: none; }

  .menu-item {
    height: 30px;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    padding: 0 14px;
    font-size: 12.5px;
    color: #eef0f5;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: default;
  }
  @media (prefers-color-scheme: light) {
    .menu-item { color: #23252e; text-shadow: none; }
  }
  .menu-item.hot { background: rgba(255, 255, 255, 0.16); }
  .menu-item.picked { background: rgba(110, 160, 255, 0.55); }
  .menu-item.danger.hot { background: rgba(229, 90, 90, 0.55); }
  @media (prefers-color-scheme: light) {
    .menu-item.hot { background: rgba(0, 0, 0, 0.08); }
    .menu-item.picked { background: rgba(70, 120, 220, 0.28); }
  }

  .menu-sep {
    height: 9px;
    flex: 0 0 auto;
    position: relative;
  }
  .menu-sep::after {
    content: '';
    position: absolute;
    left: 10px;
    right: 10px;
    top: 4px;
    height: 1px;
    background: rgba(255, 255, 255, 0.14);
  }
  @media (prefers-color-scheme: light) {
    .menu-sep::after { background: rgba(0, 0, 0, 0.12); }
  }
</style>
</head>
<body>
  <div class="menu" id="menu"></div>
  <script src="menu-view.js"></script>
</body>
</html>
