<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>文件筐</title>
<link rel="stylesheet" href="common.css">
  <script src="menu.js"></script>
<style>
  .grid { grid-template-columns: repeat(auto-fill, 88px); }
</style>
</head>
<body>
  <div class="panel">
    <div class="panel-head drag-region">
      <span class="panel-title" id="title">文件筐</span>
      <span class="panel-count" id="count"></span>
      <button class="head-btn no-drag" id="btn-collapse" title="收起 / 展开">▾</button>
      <button class="head-btn danger no-drag" id="btn-close" title="隐藏这个筐（筐里的文件一个都不会动）">✕</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <script>
    const api = window.deskbasket;
    const basketId = new URLSearchParams(location.search).get('id');
    const gridEl = document.getElementById('grid');
    const titleEl = document.getElementById('title');
    const countEl = document.getElementById('count');
    const headEl = document.querySelector('.panel-head');
    let collapsed = false;
    let current = null;

    function baseName(target) {
      return String(target).replace(/[\\/]+$/, '').split(/[\\/]/).pop() || target;
    }

    function makeCell(entry, iconSize) {
      const cell = document.createElement('div');
      cell.className = 'cell' + (entry.exists ? '' : ' missing');
      cell.title = entry.path;
      cell.style.width = Math.max(72, iconSize + 40) + 'px';

      const img = document.createElement('img');
      img.alt = '';
      img.style.width = iconSize + 'px';
      img.style.height = iconSize + 'px';
      if (entry.exists) {
        api.getIcon(entry.path, iconSize).then((dataUrl) => {
          if (dataUrl) img.src = dataUrl;
          else img.style.visibility = 'hidden';
        });
      } else {
        img.style.visibility = 'hidden';
      }

      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = entry.name;

      cell.append(img, name);

      cell.addEventListener('dblclick', async () => {
        if (!entry.exists) return;
        if (entry.isDir) {
          api.openExplorer(entry.path);
          return;
        }
        const result = await api.openPath(entry.path);
        if (result && result.ok === false) {
          alert('打不开这个文件：\n' + entry.path + (result.error ? '\n' + result.error : ''));
        }
      });

      cell.addEventListener('contextmenu', (event) => {
        event.preventDefault();
        window.__ctxEvent = event;
        openItemMenu(entry);
      });
      return cell;
    }

    async function openItemMenu(entry) {
      const items = [];
      if (entry.exists && entry.isDir) items.push({ key: 'explorer', label: '在内置窗口里打开' });
      if (entry.exists) {
        items.push({ key: 'open', label: '打开' });
        items.push({ key: 'reveal', label: '用系统资源管理器打开' });
        items.push({ separator: true });
      }
      items.push({ key: 'remove', label: '从这个筐移除' });
      const picked = await window.showContextMenu(items, window.__ctxEvent);
      if (!picked) return;
      if (picked === 'explorer') api.openExplorer(entry.path);
      else if (picked === 'open') api.openPath(entry.path);
      else if (picked === 'reveal') api.revealPath(entry.path);
      else if (picked === 'remove') await removeAndRefresh(entry.path);
    }

    async function removeAndRefresh(target) {
      await api.removeItem(basketId, target);
      await refresh();
    }

    function render() {
      if (!current) return;
      const iconSize = current.icon_size || 48;
      titleEl.textContent = current.name;
      const entries = current.entries || [];
      const missing = entries.filter((entry) => !entry.exists).length;
      countEl.textContent = missing
        ? entries.length + ' 项 · ' + missing + ' 项失效'
        : entries.length + ' 项';
      gridEl.innerHTML = '';
      for (const entry of entries) gridEl.append(makeCell(entry, iconSize));
    }

    async function refresh() {
      const view = await api.basketGet(basketId);
      if (!view) return;
      const state = await api.getState();
      current = { ...view, icon_size: state.settings.icon_size };
      render();
    }

    api.onStateChanged(() => {
      refresh();
    });

    document.getElementById('btn-close').addEventListener('click', () => api.closeWindow());
    document.getElementById('btn-collapse').addEventListener('click', () => {
      collapsed = !collapsed;
      gridEl.style.display = collapsed ? 'none' : '';
      document.getElementById('btn-collapse').textContent = collapsed ? '▸' : '▾';
    });

    // 双击标题条最大化/还原（无边框窗口没有系统行为，自己补一个）
    headEl.addEventListener('dblclick', () => api.toggleMaximize());

    document.addEventListener('dragover', (event) => {
      event.preventDefault();
      document.body.classList.add('dragover');
    });
    document.addEventListener('dragleave', () => document.body.classList.remove('dragover'));
    document.addEventListener('drop', async (event) => {
      event.preventDefault();
      document.body.classList.remove('dragover');
      const paths = api.pathsFromFiles(event.dataTransfer.files);
      if (!paths.length) return;
      await api.addPaths(basketId, paths);
      await refresh();
    });

    window.addEventListener('resize', () => {
      // 记录新的位置与大小，重启后保持
      api.saveGeometry({ x: window.screenX, y: window.screenY, width: window.outerWidth, height: window.outerHeight });
    });

    refresh();
  </script>
</body>
</html>
