<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>DeskBasket Dock</title>
<link rel="stylesheet" href="common.css">
<script src="menu.js"></script>
<style>
  html, body { width: 100%; height: 100%; }
  /* Dock 固定于桌面：位置由主进程锁死，这里不响应拖动 */
  .dock { -webkit-app-region: no-drag; }
</style>
</head>
<body>
  <div class="dock" id="dock"></div>

  <script>
    const api = window.deskbasket;
    const dockEl = document.getElementById('dock');
    let items = [];
    let iconSize = 48;

    function baseName(target) {
      return String(target).replace(/[\\/]+$/, '').split(/[\\/]/).pop() || target;
    }

    function makeItem(target) {
      const item = document.createElement('div');
      item.className = 'dock-item';
      item.title = target;

      const img = document.createElement('img');
      img.alt = '';
      img.style.width = iconSize + 'px';
      img.style.height = iconSize + 'px';
      api.getIcon(target, iconSize).then((dataUrl) => {
        if (dataUrl) img.src = dataUrl;
      });

      const tip = document.createElement('div');
      tip.className = 'tip';
      tip.textContent = baseName(target);

      item.append(img, tip);
      item.draggable = true;

      item.addEventListener('click', async () => {
        const result = await api.openPath(target);
        if (result && result.ok === false) {
          alert('打不开这一项：\n' + target);
        }
      });

      item.addEventListener('contextmenu', async (event) => {
        event.preventDefault();
        const picked = await window.showContextMenu(
          [
            { key: 'open', label: '打开' },
            { key: 'reveal', label: '用系统资源管理器打开所在位置' },
            { separator: true },
            { key: 'remove', label: '从 Dock 移除' }
          ],
          event
        );
        if (picked === 'open') api.openPath(target);
        else if (picked === 'reveal') api.revealPath(target);
        else if (picked === 'remove') {
          await api.removeDockItem(target);
          await refresh();
        }
      });

      // 拖拽排序
      item.addEventListener('dragstart', (event) => {
        event.dataTransfer.setData('text/deskbasket-index', String(items.indexOf(target)));
        event.dataTransfer.effectAllowed = 'move';
      });
      item.addEventListener('dragover', (event) => {
        if (event.dataTransfer.types.includes('text/deskbasket-index')) {
          event.preventDefault();
        }
      });
      item.addEventListener('drop', async (event) => {
        const raw = event.dataTransfer.getData('text/deskbasket-index');
        if (raw === '') return;
        event.preventDefault();
        event.stopPropagation();
        const from = Number(raw);
        const to = items.indexOf(target);
        if (Number.isNaN(from) || from === to) return;
        const next = [...items];
        const [moved] = next.splice(from, 1);
        next.splice(to, 0, moved);
        await api.reorderDock(next);
        await refresh();
      });

      return item;
    }

    function render() {
      dockEl.innerHTML = '';
      for (const target of items) dockEl.append(makeItem(target));
    }

    async function refresh() {
      const state = await api.getState();
      iconSize = state.settings.dock_icon_size || 48;
      items = await api.getDockItems();
      render();
    }

    api.onStateChanged(() => {
      refresh();
    });

    // 从桌面拖文件进来
    document.addEventListener('dragover', (event) => {
      event.preventDefault();
      document.body.classList.add('dragover');
    });
    document.addEventListener('dragleave', () => document.body.classList.remove('dragover'));
    document.addEventListener('drop', async (event) => {
      if (event.dataTransfer.types.includes('text/deskbasket-index')) return;
      event.preventDefault();
      document.body.classList.remove('dragover');
      const paths = api.pathsFromFiles(event.dataTransfer.files);
      if (!paths.length) return;
      await api.addDockPaths(paths);
      await refresh();
    });

    refresh();
  </script>
</body>
</html>
