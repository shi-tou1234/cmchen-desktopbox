<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>DeskBasket Dock</title>
<link rel="stylesheet" href="common.css">
<script src="menu.js"></script>
<style>
  /* overflow 必须是 hidden：悬停放大图标会超出条目框，visible 会让视口长出滚动条 */
  html, body { width: 100%; height: 100%; overflow: hidden; }
  /* Dock 完全透明：位置由主进程锁死，这里不响应拖动、不铺任何底色 */
  .dock {
    position: absolute;
    inset: 0;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    align-content: flex-end;
    justify-content: center;
    column-gap: 12px;   /* 与主进程 dockLayout 的 DOCK_CELL_GAP 对齐 */
    row-gap: 16px;
    overflow: visible;
    -webkit-app-region: no-drag;
  }

  .dock-item {
    position: relative;
    width: var(--icon);
    /* 图标 + 名字行；15px 与主进程 dockmodel.DOCK_CAPTION_H 对齐 */
    height: calc(var(--icon) + 15px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    border-radius: 10px;
    transform-origin: bottom center;   /* 放大向上生长（Nexus 同款） */
    will-change: transform;
  }

  .dock-item img {
    width: var(--icon);
    height: var(--icon);
    object-fit: contain;
    pointer-events: none;
    -webkit-user-drag: none;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.45));
  }

  /* 文件夹筐的名字：小小一行贴在图标下面。别的条目这一格留空（保持图标对齐） */
  .dock-caption {
    height: 15px;
    max-width: calc(var(--icon) + 12px);
    font-size: 10px;
    line-height: 15px;
    color: var(--text);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    pointer-events: none;
  }
  .dock-caption.flash { color: #9fd0ff; font-weight: 600; }

  /* 悬停不给底色：只在 ::after 时代的那圈灰被去掉了（领导说丑），
     反馈只靠放大动画 + 图标自带的投影。 */

  .dock-item.dragging { opacity: 0.4; }
  body.dragover { outline: none; }

  /* 拖文件悬停在文件夹筐上：给一圈高亮，表示"松手会放进这个筐" */
  .dock-item.droptarget { outline: 2px solid rgba(140, 190, 255, 0.85); outline-offset: 2px; }

  /* 被移除/删掉的条目：留在原位缩小淡出，别"啪"一下就没了 */
  .dock-item.leaving {
    position: fixed;
    pointer-events: none;
    transition:
      opacity 200ms ease-in,
      transform 200ms cubic-bezier(0.4, 0, 1, 1);
  }
  .dock-item.leaving.gone { opacity: 0; transform: scale(0.2); }
  /* 减弱动画（#7）：进场/移除的淡出都省掉，直接增删 */
  body.reduce-motion .dock-item.leaving { transition: none; }

  /* Dock 空态（#4）：一条都没有时给一行极淡的提示，别让人以为没显示出来 */
  .dock-empty {
    position: absolute;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    padding: 5px 14px;
    border-radius: 999px;
    border: 1px dashed var(--border);
    color: var(--text-dim);
    font-size: 12px;
    white-space: nowrap;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="dock" id="dock"></div>
  <script src="dock.js"></script>
</body>
</html>
