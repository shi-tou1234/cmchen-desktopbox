<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: file:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>改名</title>
  <link rel="stylesheet" href="common.css" />
  <style>
    /* 钉在 Dock 上方的小输入窗：只有"名字"一个字段，回车即提交、Esc 即取消 */
    .panel { padding: 12px 14px; gap: 8px; }
    .rename-head {
      font-size: 12px;
      color: var(--text-dim);
      flex: 0 0 auto;
    }
    #renameInput {
      width: 100%;
      flex: 0 0 auto;
      background: var(--field-bg);
      color: var(--field-fg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font: inherit;
      font-size: 14px;
      outline: none;
      user-select: text;
      cursor: text;
      text-shadow: none;
    }
    #renameInput:focus { border-color: rgba(140, 190, 255, 0.9); }
    .rename-foot {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1 1 auto;
    }
    .rename-hint { flex: 1 1 auto; font-size: 11px; color: var(--text-faint); line-height: 1.35; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="rename-head drag-region">改个名字</div>
    <input id="renameInput" class="no-drag" type="text" maxlength="24" spellcheck="false" />
    <div class="rename-foot">
      <span class="rename-hint" id="renameHint"></span>
      <button class="btn no-drag" id="btnCancel" type="button">取消</button>
      <button class="btn no-drag" id="btnOk" type="button">确定</button>
    </div>
  </div>

  <script src="rename.js"></script>
</body>
</html>
