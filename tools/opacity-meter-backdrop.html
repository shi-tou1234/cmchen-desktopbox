<!doctype html>
<html><head><meta charset="utf-8"><title>背板</title>
<style>html,body{margin:0;height:100%;overflow:hidden}</style></head>
<body><script>
  const c = new URLSearchParams(location.search).get('color') || '#787878';
  document.body.style.background = c;
  const label = document.createElement('div');
  label.style.cssText = 'color:#fff;font:16px sans-serif;padding:12px';
  label.textContent = '纯色背板 ' + c;
  document.body.append(label);
</script></body></html>
